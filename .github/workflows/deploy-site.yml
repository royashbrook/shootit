name: deploy shootit.royashbrook.com

# The game deploys ITSELF, the same pattern as craftrush, scoopaloo and quarry:
# pushing to main ships it to its own Cloudflare origin. Its own hostname keeps a
# game change from redeploying anything else, and a broken game from holding
# anything else up.
on:
  push:
    branches: [main]
    # CI config and docs don't change the served game, so they shouldn't burn a deploy.
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  # manual re-deploy, so a build can be reissued without a dummy commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shootit-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No build step: a vanilla PWA served from the repo root. The verifier is the
      # test suite: every level and 3 years of dailies must be solvable and
      # deterministic before a deploy.
      - run: npm run verify
      - name: check the site is present
        run: |
          test -f index.html
          test -f sw.js
          test -f manifest.json
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. add the repo secret to enable deploys."
            exit 1
          fi
          npx wrangler deploy
